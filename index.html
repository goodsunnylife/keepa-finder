<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keepa Finder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Keepa Finder">
<meta name="theme-color" content="#1f6feb">
<link id="icon" rel="apple-touch-icon" href="">
<link id="manifest" rel="manifest" href="">
<style>
:root { --bg:#f5f6f8; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#1f6feb; --border:#e3e5e8; --danger:#b42318; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg:#111418; --card:#1b2026; --text:#e8eaed; --muted:#9aa3ad; --border:#2a3139; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif; padding-bottom:env(safe-area-inset-bottom); }
header { position:sticky; top:0; z-index:1; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; background:var(--card); border-bottom:1px solid var(--border); }
h1 { font-size:18px; margin:0; }
main { max-width:640px; margin:0 auto; padding:12px; }
.panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; display:grid; gap:12px; margin-bottom:12px; }
label { display:grid; gap:4px; }
label span { font-size:13px; color:var(--muted); }
select, input, textarea { font:inherit; font-size:16px; padding:10px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); width:100%; min-width:0; min-height:44px; }
/* iOS Safari: date input ignores width:100% unless appearance is reset and it is a block */
input[type=date] { -webkit-appearance:none; appearance:none; display:block; max-width:100%; text-align:left; }
input[type=date]::-webkit-date-and-time-value { text-align:left; min-height:1.4em; }
textarea { min-height:120px; font-family:ui-monospace,monospace; font-size:13px; }
button { font:inherit; font-weight:600; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; min-height:48px; width:100%; }
button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
.msg { margin:0; font-size:14px; }
.msg.error { color:var(--danger); }
details summary { cursor:pointer; color:var(--muted); font-size:14px; }
.date-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
.date-row button { width:auto; min-height:44px; padding:0 14px; white-space:nowrap; }
.row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
.row .btns { display:flex; gap:6px; }
.row button { width:auto; min-height:40px; padding:8px 12px; }
.preset-list { display:grid; gap:6px; font-size:14px; }
</style>
</head>
<body>
<header><h1>Keepa Finder</h1></header>
<main>
  <form id="form" class="panel">
    <label><span>プリセット</span><select id="preset" required></select></label>
    <label><span>発売日がこの日から（空＝指定なし）</span>
      <div class="date-row"><input type="date" id="dateFrom"><button id="today" type="button" class="secondary">今日</button></div>
    </label>
    <label><span>発売日がこの日まで（空＝指定なし）</span>
      <div class="date-row"><input type="date" id="date"><button id="clearTo" type="button" class="secondary">空にする</button></div>
    </label>
    <button id="run" type="submit">Keepaで開く</button>
    <p id="msg" class="msg" hidden></p>
  </form>

  <details class="panel">
    <summary>プリセットの追加・削除</summary>
    <label><span>名前</span><input id="newName" placeholder="例: Amazon枯れ、値上がり"></label>
    <label><span>Keepa「APIクエリを表示する」のJSON</span><textarea id="newJson" placeholder='{"rootCategory":["13299531"], ...}'></textarea></label>
    <button id="add" type="button" class="secondary">追加（この端末に保存）</button>
    <div id="presetList" class="preset-list"></div>
  </details>
</main>

<script>
'use strict';
// ---- Built-in presets (edit this file on GitHub to change them) ----
const BUILTIN_PRESETS = [
  {
    id: 'amazon-out-price-up',
    name: 'Amazon枯れ、値上がり',
    selection: {
      current_AMAZON_gte: -1, current_AMAZON_lte: -1,
      current_NEW_gte: 2000,
      deltaPercent7_NEW_gte: -100, deltaPercent7_NEW_lte: 0,
      rootCategory: ['13299531'],
      outOfStockPercentage90_gte: 1, outOfStockPercentage90_lte: 70,
      avg365_SALES_gte: 1, avg365_SALES_lte: 30000,
      productType: ['0'],
      sort: [['current_SALES', 'asc']],
      perPage: 100, page: 0
    }
  },
  {
    id: 'major-makers',
    name: '主要メーカー',
    selection: {
      brand: ['lego(レゴ)', 'アガツマ(agatsuma)', 'エポック(epoch)', 'ジョイパレット(joypalette)', 'セガフェイブ(sega fave)', 'タカラトミー(takara tomy)', 'タカラトミーアーツ(takaratomy a.r.t.s)', 'bandai', 'メガハウス(megahouse)'],
      productType: ['0'],
      sort: [['current_SALES', 'asc'], ['monthlySold', 'desc']],
      perPage: 100, page: 0
    }
  },
  {
    id: 'amazon-out-offers-up',
    name: 'Amazon枯れ、出品者20%減',
    selection: {
      current_SALES_gte: 1, current_SALES_lte: 30000,
      current_AMAZON_gte: -1, current_AMAZON_lte: -1,
      current_NEW_gte: 2000,
      deltaPercent30_COUNT_NEW_gte: 20,
      rootCategory: ['13299531'],
      productType: ['0'],
      sort: [['current_SALES', 'asc']],
      perPage: 100, page: 0
    }
  }
];

// ---- API selection -> Keepa web finder URL ----
// Column ids in the Keepa grid differ from API field names (mapping derived from keepa.com grid.js):
//   API current_NEW <-> column NEW_current, deltaPercent7_NEW <-> NEW_deltaPercent7, avg365_SALES <-> SALES_avg365
//   API current_X in [-1,-1] (no offer) <-> column X_outOfStock boolean "on"
//   API outOfStockPercentage90 <-> column AMAZON_outOfStockPercentage90
//   date fields use {dateFrom,dateTo} "YYYY-MM-DD" instead of Keepa minutes
const KeepaUrl = (() => {
  const KEEPA_EPOCH_OFFSET_MIN = 21564000;
  const STAT_PREFIX_RE = /^(current|avg\d*|delta\d*|deltaPercent\d*)_([A-Z_]+)$/;
  const DATE_FIELDS = ['releaseDate','publicationDate','trackingSince','listedSince','lastUpdate','lastPriceChange','lastRatingUpdate','lastOffersUpdate','lastStockUpdate','lastSoldUpdate'];
  const SKIP = ['perPage','page','sort','stats'];
  const minutesToYmd = min => new Date((min + KEEPA_EPOCH_OFFSET_MIN) * 60000 + 9 * 3600000).toISOString().slice(0, 10);
  function toColId(f) {
    const m = f.match(STAT_PREFIX_RE);
    if (m) return `${m[2]}_${m[1]}`;
    if (/^outOfStockPercentage\d+$/.test(f)) return `AMAZON_${f}`;
    return f;
  }
  function build(selection, overrides) {
    overrides = overrides || {};
    const ranges = {}, f = {}, warnings = [];
    for (const key of Object.keys(selection)) {
      if (SKIP.includes(key)) continue;
      const v = selection[key];
      const m = key.match(/^(.+)_(gte|lte)$/);
      if (m) { (ranges[m[1]] = ranges[m[1]] || {})[m[2]] = v; continue; }
      if (Array.isArray(v)) {
        const vals = v.map(String);
        if (['rootCategory','categories','categories_include','categories_exclude','productType'].includes(key)) f[key] = { filter: vals.join('###') };
        else f[key] = { filter: vals.join('###'), type: 'isOneOf' };
        continue;
      }
      if (typeof v === 'boolean') { f[key] = { filterType: 'boolean', filter: v ? 1 : 0 }; continue; }
      if (typeof v === 'string' || typeof v === 'number') { f[key] = { filter: String(v), type: 'isOneOf' }; continue; }
      warnings.push(`未対応の条件: ${key}`);
    }
    // The date fields drive releaseDate; either bound may be left empty.
    if (overrides.releaseDateAfter || overrides.releaseDateBefore) {
      ranges.releaseDate = {};
      if (overrides.releaseDateAfter) ranges.releaseDate.gte = overrides.releaseDateAfter;
      if (overrides.releaseDateBefore) ranges.releaseDate.lte = overrides.releaseDateBefore;
    } else {
      delete ranges.releaseDate;
    }
    for (const base of Object.keys(ranges)) {
      const { gte, lte } = ranges[base];
      const hasG = gte != null, hasL = lte != null;
      const stat = base.match(STAT_PREFIX_RE);
      if (stat && stat[1] === 'current' && gte === -1 && lte === -1) { f[`${stat[2]}_outOfStock`] = { filterType: 'boolean', filter: 'on' }; continue; }
      if (DATE_FIELDS.includes(base)) {
        const ymd = x => (typeof x === 'string' ? x : minutesToYmd(x));
        const model = { filterType: 'date', dateTo: null };
        if (hasG && hasL) Object.assign(model, { type: 'inRange', dateFrom: ymd(gte), dateTo: ymd(lte) });
        else if (hasG) Object.assign(model, { type: 'greaterThanOrEqual', dateFrom: ymd(gte) });
        else Object.assign(model, { type: 'lessThanOrEqual', dateFrom: ymd(lte) });
        f[base] = model; continue;
      }
      const model = { filterType: 'number' };
      if (hasG && hasL) Object.assign(model, { type: 'inRange', filter: gte, filterTo: lte });
      else if (hasG) Object.assign(model, { type: 'greaterThanOrEqual', filter: gte });
      else Object.assign(model, { type: 'lessThanOrEqual', filter: lte });
      f[toColId(base)] = model;
    }
    const s = Array.isArray(selection.sort) ? selection.sort.map(([field, dir]) => ({ colId: toColId(field), sort: dir })) : null;
    const state = { f, s, t: 'g' };
    return { url: 'https://keepa.com/#!finder/' + encodeURIComponent(JSON.stringify(state)), state, warnings };
  }
  return { build };
})();

// ---- App ----
const $ = id => document.getElementById(id);
const presetEl = $('preset'), dateEl = $('date'), dateFromEl = $('dateFrom'), msgEl = $('msg');
const DEFAULT_DAYS_BACK = 547; // 1年半
const LS_PRESETS = 'userPresets', LS_LAST = 'lastPreset', LS_NAMES = 'presetNames'; // LS_NAMES: renamed built-ins {id: name}

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function showMsg(t, err) { msgEl.textContent = t; msgEl.classList.toggle('error', !!err); msgEl.hidden = !t; }
function isoDate(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }

function allPresets() {
  const names = lsGet(LS_NAMES, {});
  return [...BUILTIN_PRESETS.map(p => ({ ...p, name: names[p.id] || p.name })), ...lsGet(LS_PRESETS, [])];
}

function renamePreset(p) {
  const name = (prompt('新しい名前', p.name) || '').trim();
  if (!name || name === p.name) return;
  if (p.user) {
    lsSet(LS_PRESETS, lsGet(LS_PRESETS, []).map(x => x.id === p.id ? { ...x, name } : x));
  } else {
    lsSet(LS_NAMES, { ...lsGet(LS_NAMES, {}), [p.id]: name });
  }
  renderPresets();
}

function renderPresets() {
  const list = allPresets();
  presetEl.innerHTML = '';
  for (const p of list) { const o = document.createElement('option'); o.value = p.id; o.textContent = p.name; presetEl.appendChild(o); }
  const last = lsGet(LS_LAST, null);
  if (last && list.some(p => p.id === last)) presetEl.value = last;

  const box = $('presetList'); box.innerHTML = '';
  for (const p of list) {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.textContent = p.name + (p.user ? '' : '（内蔵）');
    row.appendChild(name);
    const btns = document.createElement('span'); btns.className = 'btns'; row.appendChild(btns);
    const ren = document.createElement('button'); ren.type = 'button'; ren.className = 'secondary'; ren.textContent = '名前変更';
    ren.onclick = () => renamePreset(p);
    btns.appendChild(ren);
    if (p.user) {
      const del = document.createElement('button'); del.type = 'button'; del.className = 'danger'; del.textContent = '削除';
      del.onclick = () => { lsSet(LS_PRESETS, lsGet(LS_PRESETS, []).filter(x => x.id !== p.id)); renderPresets(); };
      btns.appendChild(del);
    }
    box.appendChild(row);
  }
}

$('form').addEventListener('submit', e => {
  e.preventDefault(); showMsg('');
  const preset = allPresets().find(p => p.id === presetEl.value);
  if (!preset) return showMsg('プリセットを選んでください', true);
  if (dateFromEl.value && dateEl.value && dateFromEl.value > dateEl.value) return showMsg('発売日の範囲が逆です', true);
  lsSet(LS_LAST, preset.id);
  const { url, warnings } = KeepaUrl.build(preset.selection, { releaseDateAfter: dateFromEl.value, releaseDateBefore: dateEl.value });
  if (warnings.length) showMsg(warnings.join(' / '), true);
  location.href = url; // standalone PWA on iOS hands external URLs to Safari
});

$('today').addEventListener('click', () => { dateFromEl.value = isoDate(new Date()); });
$('clearTo').addEventListener('click', () => { dateEl.value = ''; });

$('add').addEventListener('click', () => {
  const name = $('newName').value.trim(), raw = $('newJson').value.trim();
  if (!name || !raw) return showMsg('名前とJSONを入れてください', true);
  let sel;
  try { sel = JSON.parse(raw); } catch { return showMsg('JSONが読めません。Keepaの「APIクエリを表示する」の内容をそのまま貼ってください', true); }
  if (typeof sel !== 'object' || Array.isArray(sel)) return showMsg('JSONの形が違います', true);
  delete sel.releaseDate_lte; delete sel.releaseDate_gte; // set from the date field at run time
  const list = lsGet(LS_PRESETS, []);
  list.push({ id: 'u' + Date.now(), name, selection: sel, user: true });
  lsSet(LS_PRESETS, list);
  $('newName').value = ''; $('newJson').value = '';
  renderPresets(); presetEl.value = list[list.length - 1].id;
  showMsg(`「${name}」を追加しました`);
});

// Icon + manifest generated at runtime (no static base64 to mistype).
(function setupPwa() {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const g = c.getContext('2d');
  g.fillStyle = '#1f6feb'; g.fillRect(0, 0, 180, 180);
  g.fillStyle = '#fff'; g.font = 'bold 96px -apple-system, Helvetica, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('K', 90, 96);
  const icon = c.toDataURL('image/png');
  $('icon').href = icon;
  const manifest = { name: 'Keepa Finder', short_name: 'Keepa Finder', start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#f5f6f8', theme_color: '#1f6feb', icons: [{ src: icon, sizes: '180x180', type: 'image/png' }] };
  $('manifest').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
})();

const d = new Date(); d.setDate(d.getDate() - DEFAULT_DAYS_BACK); dateEl.value = isoDate(d);
renderPresets();
</script>
</body>
</html>
